services:
  kingshot-redeemer:
    image: brenak/kingshot-redeemer:latest
    container_name: ${CONTAINER_NAME:-sdw-redeemer-bot}
    restart: unless-stopped
    command: python -u main.py
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - DISCORD_GUILD_ID=${DISCORD_GUILD_ID:-1530565101453840434}
      - MIGHTPULSE_API_KEY=${MIGHTPULSE_API_KEY}
    volumes:
      - kingshot-data:/app/data
    networks:
      - bot-network

volumes:
  kingshot-data:
    name: ${DATA_VOLUME:-kingshot-data}

networks:
  bot-network:
    driver: bridge